<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Domestica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1713">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domestica">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Domestica showroom assistant">

<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#bff3d6;--g2:#5fc79a;--g3:#1f6f53;--bg:#0b1713}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 35%,#163a2d 0%,var(--bg) 62%);color:#eef6f1;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);text-align:center}
.brand{font-weight:700;letter-spacing:.5em;font-size:clamp(14px,2vw,22px);color:#9fe0b8;margin-right:-.5em}
#orb{position:relative;width:min(56vmin,420px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer}
#orb .core{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--g1) 0%,var(--g2) 38%,var(--g3) 72%,#0d2a20 100%);box-shadow:0 0 0 3px rgba(191,243,214,.2),0 20px 80px rgba(31,111,83,.6);transform:scale(calc(.9 + var(--lvl,0)*.18));transition:transform .08s linear;animation:breath 4.5s ease-in-out infinite}
#orb .core:after{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px solid rgba(127,224,174,.45);animation:ring 4.5s ease-in-out infinite}
#orb svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 18s linear infinite;pointer-events:none}
#orb svg text{font:700 9.5px/1 Inter,system-ui;letter-spacing:4.2px;fill:#e9fff3}
#orb .lt{animation:letters 4.5s ease-in-out infinite;transform-origin:46px 46px}
body.listening #orb svg{animation-duration:7s}
body.speaking #orb svg{animation-duration:4s}
body.connecting #orb svg{animation-duration:1.5s}
body.listening #orb .core,body.speaking #orb .core{animation:none}
@keyframes breath{0%,100%{transform:scale(.9)}50%{transform:scale(1)}}
@keyframes ring{0%,100%{transform:scale(.94);opacity:.25}50%{transform:scale(1.08);opacity:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes letters{0%,100%{transform:scale(.86);opacity:.35}50%{transform:scale(1.04);opacity:1}}
#status{font-size:clamp(18px,2.6vw,30px);font-weight:600;min-height:1.4em}
#sub{max-width:min(900px,92vw);font-size:clamp(16px,2.1vw,26px);line-height:1.45;color:#cfe9dc;min-height:3em}
#sub .you{color:#9fe0b8}
#end{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:12px 26px;font:600 16px Inter,system-ui;cursor:pointer}
#end[hidden]{display:none}
.foot{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;font-size:12px;color:#7f958b}
#cards{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;max-width:94vw}
#cards:empty{display:none}
.pc{width:min(26vw,300px);background:rgba(255,255,255,.06);border:1px solid rgba(191,243,214,.2);border-radius:18px;overflow:hidden;text-align:left;animation:pin .5s ease-out both}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:block}
.pc .b{padding:12px 14px}
.pc .t{font-weight:600;font-size:clamp(14px,1.4vw,18px);line-height:1.3}
.pc .p{margin-top:6px;font-size:clamp(16px,1.6vw,22px);font-weight:700;color:#9fe0b8}
.pc .p s{color:#8aa197;font-weight:400;font-size:.8em;margin-left:8px}
.pc .d{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;background:#b8613c;color:#fff;border-radius:999px;padding:3px 9px}
@keyframes pin{from{opacity:0;transform:translateY(16px)}}
body.has-cards #orb{width:min(30vmin,240px)}
body.has-cards main{gap:2.2vh}
#orb{transition:width .4s ease}
</style>
</head>
<body>
<main>
  <div class="brand">DOMESTICA</div>
  <button id="orb" type="button" aria-label="Tap to talk to Domestica">
    <div class="core"></div>
    <svg viewBox="0 0 92 92" aria-hidden="true"><defs><path id="c" d="M46,46 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0"/></defs><g class="lt"><text><textPath href="#c">DOMESTICA · DOMESTICA · </textPath></text></g></svg>
  </button>
  <div id="status">Tap the orb and say hello</div>
  <div id="sub">Ask about any piece in the showroom – prices, sizes, colours, offers – or book a free consultation.</div>
  <div id="cards"></div>
  <button id="end" type="button" hidden>End conversation</button>
</main>
<div class="foot">You're talking to Domestica's AI assistant. Conversations are recorded to improve our service.</div>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
const AGENT = "agent_1801m7dts975e2hv3zhqz9bn7z0m";
const $ = id => document.getElementById(id);
let CAT = [];
const norm = t => String(t||"").toLowerCase().replace(/[–—-]/g," ").replace(/[^a-z0-9à-ÿ ]/g," ").replace(/\s+/g," ").trim();
(async () => {
  try {
    for (let p = 1; p <= 8; p++) {
      const r = await fetch("https://www.domestica.com.mt/products.json?limit=250&page=" + p);
      const j = await r.json(); const ps = j.products || [];
      for (const x of ps) {
        if (x.product_type === "Bespoke Components") continue;
        const v = x.variants || []; const pr = Math.min(...v.map(a => +a.price || 0));
        const cmp = Math.max(0, ...v.map(a => +a.compare_at_price || 0));
        CAT.push({ t: x.title, n: norm(x.title), h: x.handle, img: (x.images && x.images[0] && x.images[0].src) || "", price: pr, was: cmp > pr ? cmp : 0, avail: v.some(a => a.available) });
      }
      if (ps.length < 250) break;
    }
  } catch (e) { console.warn("catalogue", e); }
})();
function best(name){
  const q = norm(name); if (!q) return null; const qt = q.split(" ");
  let top = null, sc = 0;
  for (const c of CAT) {
    if (c.n === q) return c;
    const ct = c.n.split(" "); let hit = 0; for (const w of qt) if (ct.includes(w)) hit++;
    const s = hit / Math.max(qt.length, ct.length) + (c.n.includes(q) ? .3 : 0) + (c.avail ? .05 : 0);
    if (s > sc) { sc = s; top = c; }
  }
  return sc >= .45 ? top : null;
}
const eur = n => "€" + Number(n).toLocaleString("en-IE", { maximumFractionDigits: 2 });
function showProducts({ names }){
  const box = $("cards"); box.textContent = "";
  const seen = new Set();
  String(names||"").split(/[|;\n]/).slice(0,3).forEach(nm => {
    const c = best(nm); if (!c || seen.has(c.h)) return; seen.add(c.h);
    const d = document.createElement("div"); d.className = "pc";
    if (c.img) { const i = document.createElement("img"); i.src = c.img.replace(/(\.[a-z]+)(\?|$)/i, "$1$2") + (c.img.includes("?") ? "&" : "?") + "width=600"; i.alt = c.t; d.appendChild(i); }
    const b = document.createElement("div"); b.className = "b";
    const t = document.createElement("div"); t.className = "t"; t.textContent = c.t; b.appendChild(t);
    const p = document.createElement("div"); p.className = "p"; p.textContent = c.price ? eur(c.price) : "Price on request";
    if (c.was) { const w = document.createElement("s"); w.textContent = eur(c.was); p.appendChild(w); }
    b.appendChild(p);
    if (c.was) { const g = document.createElement("span"); g.className = "d"; g.textContent = "BLACK NOVEMBER"; b.appendChild(g); }
    d.appendChild(b); box.appendChild(d);
  });
  document.body.classList.toggle("has-cards", !!box.children.length);
  return box.children.length ? "shown" : "not found";
}
window.__dom = { showProducts, cat: () => CAT.length };
let conv = null, raf = 0, idleTimer = 0, starting = false;
const src = new URLSearchParams(location.search).get("src") || "direct";
function setState(s, txt){ const hc = document.body.classList.contains("has-cards"); document.body.className = s; if (hc) document.body.classList.add("has-cards"); if (txt != null) $("status").textContent = txt; }
function loop(){
  if (!conv) return;
  let v = 0;
  try { v = document.body.classList.contains("speaking") ? conv.getOutputVolume() : conv.getInputVolume(); } catch(e){}
  document.documentElement.style.setProperty("--lvl", Math.min(1, v * 2.5).toFixed(3));
  raf = requestAnimationFrame(loop);
}
function reset(msg){
  cancelAnimationFrame(raf); conv = null;
  document.documentElement.style.setProperty("--lvl", 0);
  setState("", msg || "Tap the orb and say hello");
  $("end").hidden = true;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { $("cards").textContent = ""; document.body.classList.remove("has-cards"); $("sub").textContent = "Ask about any piece in the showroom – prices, sizes, colours, offers – or book a free consultation."; }, 8000);
}
async function start(){
  if (conv || starting) return;
  starting = true;
  setState("connecting", "Connecting…");
  $("sub").textContent = "";
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    conv = await Conversation.startSession({
      agentId: AGENT,
      connectionType: "webrtc",
      dynamicVariables: { source: src },
      clientTools: { show_products: showProducts },
      onConnect: () => { $("end").hidden = false; loop(); },
      onDisconnect: (d) => reset(d && d.reason === "error" ? "The assistant isn't available right now – please ask anyone at the front desk" : "Thanks for visiting Domestica"),
      onError: (e) => { console.error(e); reset("Sorry, something went wrong – tap to try again"); },
      onModeChange: ({ mode }) => setState(mode === "speaking" ? "speaking" : "listening", mode === "speaking" ? "Domestica is speaking…" : "Listening…"),
      onMessage: ({ message, source }) => {
        const el = $("sub"); el.textContent = "";
        if (source === "user") { const s = document.createElement("span"); s.className = "you"; s.textContent = "You: " + message; el.appendChild(s); }
        else el.textContent = message;
      }
    });
  } catch (e) {
    console.error(e);
    reset(e && e.name === "NotAllowedError" ? "Please allow the microphone, then tap the orb" : "The assistant isn't available right now – please ask anyone at the front desk");
  } finally { starting = false; }
}
$("orb").addEventListener("click", () => {
  if (new URLSearchParams(location.search).get("kiosk") === "1" && !document.fullscreenElement) { try { document.documentElement.requestFullscreen(); } catch(e){} } if (starting) return; conv ? conv.endSession() : start(); });
$("end").addEventListener("click", () => conv && conv.endSession());
// Save credits: stop the call when the visitor leaves the page or locks the phone
document.addEventListener("visibilitychange", () => { if (document.hidden && conv) { try { conv.endSession(); } catch(e){} } });
window.addEventListener("pagehide", () => { if (conv) { try { conv.endSession(); } catch(e){} } });
</script>
</body>
</html>
