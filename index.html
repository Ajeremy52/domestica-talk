body.has-tray .foot{display:none}
.pc .acts button{flex:1;text-align:center;font:700 13px Inter,system-ui;border-radius:10px;padding:8px 6px;border:1px solid #9fe0b8;background:#9fe0b8;color:#0f2a1f;cursor:pointer}
.pc .d{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;background:#b8613c;color:#fff;border-radius:999px;padding:3px 9px}
@keyframes pin{from{opacity:0;transform:translateY(16px)}}

body.has-cards .foot{display:none}
body.kiosk .pc{width:min(28vw,440px)}
body.kiosk .pc .t{font-size:clamp(18px,1.5vw,26px)}
body.kiosk .pc .p{font-size:clamp(20px,1.8vw,30px)}
body.kiosk .pc .qr{font-size:clamp(14px,1vw,18px)}
body.kiosk .pc .qr img{width:clamp(110px,8vw,150px);height:auto}
body.kiosk.has-cards #sub{font-size:clamp(18px,1.6vw,28px)}
@media (max-height:500px){.foot{display:none} #orb{width:min(40vmin,260px)} main{gap:2vh}}
@media (max-width:700px){.pc{width:min(78vw,320px)} body.has-cards #cards{flex-direction:column;align-items:center}}
#orb{transition:width .4s ease}
</style>

<body>
<main>

<div class="foot">You're talking to Domestica's AI assistant. Conversations are recorded to improve our service.</div>
<script type="module">
let Conversation = null, QRCode = null;
const loadSDK = () => Conversation ? Promise.resolve(Conversation) : import("https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm").then(m => (Conversation = m.Conversation));
const loadQR = () => QRCode ? Promise.resolve(QRCode) : import("https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm").then(m => (QRCode = m.default));
loadSDK().catch(() => {}); loadQR().catch(() => {});
const AGENT = "agent_1801m7dts975e2hv3zhqz9bn7z0m";
const $ = id => document.getElementById(id);
const SITE_ = "https://www.domestica.com.mt";
let CAT = [];
const norm = t => String(t||"").toLowerCase().replace(/[–—-]/g," ").replace(/[^a-z0-9à-ÿ ]/g," ").replace(/\s+/g," ").trim();
(async () => {
  try {
    for (let p = 1; p <= 8; p++) {
      const r = await fetch("https://www.domestica.com.mt/products.json?limit=250&page=" + p);
      const j = await r.json(); const ps = j.products || [];
      for (const x of ps) {
        if (x.product_type === "Bespoke Components") continue;
        const v = x.variants || []; const pr = Math.min(...v.map(a => +a.price || 0));
        const cmp = Math.max(0, ...v.map(a => +a.compare_at_price || 0));
        CAT.push({ t: x.title, n: norm(x.title), h: x.handle, img: (x.images && x.images[0] && x.images[0].src) || "", price: pr, was: cmp > pr ? cmp : 0, avail: v.some(a => a.available), vid: ((v.find(a => a.available) || v[0] || {}).id) || 0 });
      }
      if (ps.length < 250) break;
    }
  } catch (e) { console.warn("catalogue", e); }
})();
function best(name){
  const q = norm(name); if (!q) return null; const qt = q.split(" ");
  let top = null, sc = 0;
  for (const c of CAT) {
    if (c.n === q) return c;
    const ct = c.n.split(" "); let hit = 0; for (const w of qt) if (ct.includes(w)) hit++;
    const s = hit / Math.max(qt.length, ct.length) + (c.n.includes(q) ? .3 : 0) + (c.avail ? .05 : 0);
    if (s > sc) { sc = s; top = c; }
  }
  return sc >= .45 ? top : null;
}
const eur = n => { const v = Number(n); return "€" + v.toLocaleString("en-IE", Number.isInteger(v) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
// ---- My list: collect products during the chat, check out once at the end ----
let LIST = []; try { LIST = JSON.parse(sessionStorage.getItem("domList") || "[]"); } catch(e) { LIST = []; }
const saveList = () => { try { sessionStorage.setItem("domList", JSON.stringify(LIST)); } catch(e) {} };
const inList = vid => LIST.some(x => x.id === vid);
function checkoutUrl(medium){
  return SITE_ + "/cart/add?" + LIST.map((x, i) => "items[" + i + "][id]=" + x.id + "&items[" + i + "][quantity]=" + x.q).join("&") + "&return_to=" + encodeURIComponent("/cart?utm_source=showroom_assistant&utm_medium=" + encodeURIComponent(medium || SRC) + "&utm_campaign=voice_assistant");
}
function listAdd(c, q){ const e = LIST.find(x => x.id === c.vid); if (e) e.q = q; else LIST.push({ id: c.vid, t: c.t, p: c.price, q }); saveList(); renderTray(); }
function listRemove(vid){ LIST = LIST.filter(x => x.id !== vid); saveList(); renderTray(); }
function listSummary(){ if (!LIST.length) return "The list is empty."; const tot = LIST.reduce((n, x) => n + x.p * x.q, 0); return "List: " + LIST.map(x => x.t + (x.q > 1 ? " x" + x.q : "") + " (" + eur(x.p) + " each)").join("; ") + ". Total " + eur(tot) + "."; }
function renderTray(){
  const tr = $("tray"); if (!tr) return;
  tr.textContent = "";
  if (!LIST.length) { tr.hidden = true; document.body.classList.remove("has-tray"); return; }
  tr.hidden = false; document.body.classList.add("has-tray");
  const n = LIST.reduce((k, x) => k + x.q, 0), tot = LIST.reduce((k, x) => k + x.p * x.q, 0);
  const info = document.createElement("button"); info.type = "button"; info.className = "ti";
  info.textContent = "My list · " + n + (n === 1 ? " item" : " items") + " · " + eur(tot); info.onclick = () => tr.classList.toggle("open");
  const det = document.createElement("div"); det.className = "td";
  LIST.forEach(x => { const r = document.createElement("div"); r.className = "tr"; const s = document.createElement("span"); s.textContent = x.q + " × " + x.t; const rm = document.createElement("button"); rm.type = "button"; rm.textContent = "Remove"; rm.onclick = () => listRemove(x.id); r.append(s, rm); det.appendChild(r); });
  tr.append(info, det);
  if (KIOSK) {
    const qr = document.createElement("div"); qr.className = "tq"; const qi = document.createElement("img"); qi.alt = "Scan to check out on your phone";
    loadQR().then(Q => Q.toDataURL(checkoutUrl("screen_qr"), { margin: 1, width: 260 })).then(u => qi.src = u).catch(() => qr.remove());
    const qt = document.createElement("span"); qt.textContent = "Scan to take your list to checkout on your phone"; qr.append(qi, qt); tr.appendChild(qr);
  } else {
    const go = document.createElement("a"); go.className = "tg"; go.href = checkoutUrl(); go.target = "_blank"; go.rel = "noopener"; go.textContent = "Go to checkout →";
    go.onclick = () => { setTimeout(() => { LIST = []; saveList(); renderTray(); }, 1500); };
    tr.appendChild(go);
  }
}
function manageList({ action, names }){
  if (action === "clear") { LIST = []; saveList(); renderTray(); return "The list is now empty."; }
  if (action === "show") { $("tray") && $("tray").classList.add("open"); return listSummary(); }
  const arr = (Array.isArray(names) ? names : String(names || "").split(/[|;\n]/)).map(x => String(x).trim()).filter(Boolean);
  const done = [], miss = [];
  arr.forEach(raw => {
    let q = 1; const mq = raw.match(/\s*[x×]\s*(\d{1,2})\s*$/i); const nm = mq ? raw.slice(0, mq.index) : raw; if (mq) q = Math.max(1, Math.min(50, +mq[1]));
    const c = best(nm); if (!c) { miss.push(nm); return; }
    if (action === "remove") { listRemove(c.vid); done.push(c.t); return; }
    if (!(c.price && c.avail && c.vid)) { miss.push(c.t + " (not sold online, a salesperson can help)"); return; }
    listAdd(c, q); done.push(c.t + (q > 1 ? " x" + q : ""));
  });
  return (done.length ? (action === "remove" ? "Removed: " : "Added: ") + done.join("; ") + ". " : "") + (miss.length ? "Could not add: " + miss.join("; ") + ". " : "") + listSummary();
}
function showProducts({ names }){
  const box = $("cards");
  const seen = new Set(), missing = [], picks = [];
  (Array.isArray(names) ? names : String(names||"").split(/[|;\n]/)).map(x=>String(x).trim()).filter(Boolean).slice(0,3).forEach(raw => {
    let q0 = 1; const mq = raw.match(/\s*[x×]\s*(\d{1,2})\s*$/i); const nm = mq ? raw.slice(0, mq.index) : raw; if (mq) q0 = Math.max(1, Math.min(50, +mq[1]));
    const c = best(nm); if (!c) { missing.push(nm); return; } if (seen.has(c.h)) return; seen.add(c.h); picks.push([c, q0]);
  });
  if (!picks.length) return CAT.length ? "Nothing new shown; the screen still shows the previous products. Not found: " + missing.join("; ") : "The product photos are not available right now; describe the products in words.";
  box.textContent = "";
  picks.forEach(([c, q0]) => {
    const d = document.createElement("div"); d.className = "pc";
    const ph = () => { const f = document.createElement("div"); f.className = "ph"; f.textContent = "DOMESTICA"; return f; };
    if (c.img) { const i = document.createElement("img"); i.src = c.img + (c.img.includes("?") ? "&" : "?") + "width=600"; i.alt = c.t; i.onerror = () => i.replaceWith(ph()); d.appendChild(i); } else d.appendChild(ph());
    const b = document.createElement("div"); b.className = "b";
    const t = document.createElement("div"); t.className = "t"; t.textContent = c.t; b.appendChild(t);
    const p = document.createElement("div"); p.className = "p"; p.textContent = c.price ? eur(c.price) : "Price on request";
    if (c.was) { const w = document.createElement("s"); w.textContent = eur(c.was); p.appendChild(w); }
    b.appendChild(p);
    if (c.was) { const g = document.createElement("span"); g.className = "d"; g.textContent = "BLACK NOVEMBER"; b.appendChild(g); }
    const SITE = SITE_;
    const utm = "utm_source=showroom_assistant&utm_medium=" + encodeURIComponent(SRC) + "&utm_campaign=voice_assistant";
    const purl = SITE + "/products/" + c.h + "?" + utm;
    const buyable = !!(c.price && c.avail && c.vid);
    let q = q0;
    if (buyable) {
      const qd = document.createElement("div"); qd.className = "qty";
      const mi = document.createElement("button"); mi.type = "button"; mi.textContent = "−"; mi.setAttribute("aria-label", "One less");
      const qv = document.createElement("b"); qv.textContent = q;
      const pl = document.createElement("button"); pl.type = "button"; pl.textContent = "+"; pl.setAttribute("aria-label", "One more");
      const ql = document.createElement("span"); ql.textContent = "Quantity";
      qd.append(ql, mi, qv, pl); b.appendChild(qd);
      mi.onclick = () => { q = Math.max(1, q - 1); qv.textContent = q; };
      pl.onclick = () => { q = Math.min(50, q + 1); qv.textContent = q; };
    }
    const a = document.createElement("div"); a.className = "acts";
    if (buyable) {
      const add = document.createElement("button"); add.type = "button"; add.className = "buy"; add.textContent = inList(c.vid) ? "In your list ✓" : "Add to my list";
      add.onclick = () => { listAdd(c, q); add.textContent = "In your list ✓"; };
      a.appendChild(add);
    }
    if (!KIOSK) { const l1 = document.createElement("a"); l1.href = purl; l1.target = "_blank"; l1.rel = "noopener"; l1.textContent = "View on website"; a.appendChild(l1); }
    b.appendChild(a);
    if (KIOSK) {
      const qr = document.createElement("div"); qr.className = "qr";
      const qi = document.createElement("img"); qi.alt = "Scan to open on your phone";
      loadQR().then(Q => Q.toDataURL(SITE + "/products/" + c.h + "?" + utm.replace(encodeURIComponent(SRC), "screen_qr"), { margin: 1, width: 200 }).then(u => qi.src = u)).catch(() => { qr.remove(); });
      const qt = document.createElement("span"); qt.textContent = "Scan to see it on your phone";
      qr.appendChild(qi); qr.appendChild(qt); b.appendChild(qr);
    }
    d.appendChild(b); box.appendChild(d);
  });
  document.body.classList.toggle("has-cards", !!box.children.length);
  const shownTxt = picks.map(([c, q]) => c.t + (q > 1 ? " x" + q : "") + (c.price ? " (" + eur(c.price) + ")" : " (price on request)")).join("; ");
  return "Now on the screen: " + shownTxt + "." + (missing.length ? " Not found: " + missing.join("; ") + "." : "");
}
const LINKS = {
  directions_showroom: ["Domestica Showroom", "Valley Road, Msida · Mon–Fri 09:00–13:00, 15:30–19:30 · Sat 09:00–13:00", "Get directions", "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent("Domestica, Triq Il-Wied Ta' L-Imsida, Msida, Malta")],
  directions_factory: ["Domestica Factory", "Attard Industrial Estate, Triq L-Imdina, Attard · visits by appointment", "Get directions", "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent("Domestica, Attard Industrial Estate, Triq L-Imdina, Attard, Malta")],
  call: ["Call Domestica", "+356 2144 7604", "Call now", "tel:+35621447604"],

};
function showLink({ kind }){

  const b = document.createElement("div"); b.className = "b";

window.__dom = { showProducts, showLink, manageList, cat: () => CAT.length };
let conv = null, raf = 0, idleTimer = 0, starting = false;
// Wake word: say "Domestica" (like "Hey Siri") to start, on the showroom screen (?kiosk=1) or with ?wake=1
const QS = new URLSearchParams(location.search);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE = !!SR && (QS.get("kiosk") === "1" || QS.get("wake") === "1");
const IDLE_TXT = WAKE ? "Say \u201cDomestica\u201d or tap the orb" : "Tap the orb and say hello";
let rec = null, recOn = false;
function wakeStop(){ recOn = false; if (rec) { try { rec.abort(); } catch(e){} } }
function wakeListen(){
  if (!WAKE || conv || starting || recOn || document.hidden) return;
  if (!rec) {
    rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-GB";
    rec.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript.toLowerCase();
        if (/dome?stic+[ae]|domestika|domestic a\b/.test(t)) { wakeStop(); start(); return; }
      }
    };
    rec.onend = () => { const was = recOn; recOn = false; if (was) setTimeout(wakeListen, 400); };
    rec.onerror = (e) => { if (e.error === "not-allowed") { recOn = false; rec = null; } };
  }
  try { rec.start(); recOn = true; } catch(e) { recOn = false; }
}
const _q = new URLSearchParams(location.search);
const KIOSK = _q.get("kiosk") === "1";
const SRC = _q.get("src") || (KIOSK ? "screen" : (/domestica\.com\.mt/.test(document.referrer) ? "website" : "direct"));
if (KIOSK) document.body.classList.add("kiosk");
const DEVICE = KIOSK ? "showroom screen" : (/Mobi|Android|iPhone/i.test(navigator.userAgent) ? "phone" : "computer");
const src = SRC;
function setState(s, txt){ const hc = document.body.classList.contains("has-cards"), mu = document.body.classList.contains("multi"); document.body.className = s; if (hc) document.body.classList.add("has-cards"); if (mu) document.body.classList.add("multi"); if (KIOSK) document.body.classList.add("kiosk"); if (LIST.length) document.body.classList.add("has-tray"); if (txt != null) $("status").textContent = txt; }
function loop(){
  if (!conv) return;
  let v = 0;
  try { v = document.body.classList.contains("speaking") ? conv.getOutputVolume() : conv.getInputVolume(); } catch(e){}
  document.documentElement.style.setProperty("--lvl", Math.min(1, v * 2.5).toFixed(3));
  raf = requestAnimationFrame(loop);
}
function reset(msg){
  cancelAnimationFrame(raf); conv = null;
  document.documentElement.style.setProperty("--lvl", 0);
  setState("", msg || IDLE_TXT);
  setTimeout(wakeListen, 1500);
  $("end").hidden = true;
  clearTimeout(idleTimer);

}
async function start(){

      agentId: AGENT,
      connectionType: "webrtc",

      onConnect: () => { $("end").hidden = false; loop(); },
      onDisconnect: (d) => reset(d && d.reason === "error" ? "The assistant isn't available right now – please ask anyone at the front desk" : "Thanks for visiting Domestica"),
      onError: (e) => { console.error(e); reset("Sorry, something went wrong – tap to try again"); },
      onModeChange: ({ mode }) => setState(mode === "speaking" ? "speaking" : "listening", mode === "speaking" ? "Domestica is speaking…" : "Listening…"),
      onMessage: ({ message, source }) => {
        const el = $("sub"); el.textContent = "";
        if (source === "user") { const s = document.createElement("span"); s.className = "you"; s.textContent = "You: " + message; el.appendChild(s); }
        else el.textContent = message;
        el.scrollTop = el.scrollHeight;
      }
    });
  } catch (e) {
    console.error(e);
    reset(e && e.name === "NotAllowedError" ? "Please allow the microphone, then tap the orb" : "The assistant isn't available right now – please ask anyone at the front desk");
  } finally { starting = false; }
}
$("orb").addEventListener("click", () => {
  if (new URLSearchParams(location.search).get("kiosk") === "1" && !document.fullscreenElement) { try { document.documentElement.requestFullscreen(); } catch(e){} } if (starting) return; conv ? conv.endSession() : start(); });
$("end").addEventListener("click", () => conv && conv.endSession());
// Save credits: stop the call when the visitor leaves the page or locks the phone
document.addEventListener("visibilitychange", () => { if (document.hidden && conv) { try { conv.endSession(); } catch(e){} } });

if (WAKE) { $("status").textContent = IDLE_TXT; navigator.mediaDevices.getUserMedia({ audio: true }).then(st => { st.getTracks().forEach(t => t.stop()); wakeListen(); }).catch(() => {}); }
renderTray();
window.addEventListener("pagehide", () => { if (conv) { try { conv.endSession(); } catch(e){} } });
